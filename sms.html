<html lang="ko">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep>
<title data-keep>중계분원 안내 문자 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-keep>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" data-keep>
<style data-keep>
:root{
  --bg:#EDF4F1; --surface:#FFFFFF; --sunk:#F5F9F7; --ink:#1D2A44; --muted:#5B677A; --line:#D2DED9;
  --yellow:#FFC41F; --yellow-soft:#FFF3C9; --on-yellow:#2B2100; --blue:#2457C5; --red:#C23B2B; --red-soft:#FCEBE8;
  --screen:#E9EEF3; --bubble:#FFFFFF; --ok:#1E7A4F;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202C; --sunk:#121A24; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3748;
  --yellow:#FFC41F; --yellow-soft:#3A3115; --on-yellow:#2B2100; --blue:#7FA6FF; --red:#FF8A78; --red-soft:#3A1E1A;
  --screen:#0B1118; --bubble:#202B39; --ok:#5FD39A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202C; --sunk:#121A24; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3748;
  --yellow:#FFC41F; --yellow-soft:#3A3115; --on-yellow:#2B2100; --blue:#7FA6FF; --red:#FF8A78; --red-soft:#3A1E1A;
  --screen:#0B1118; --bubble:#202B39; --ok:#5FD39A; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:22px}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow);font-weight:700}
nav.tabs .gap{flex:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* compose */
.compose{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.block h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.block h2 .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;display:grid;place-items:center}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--ink);width:100%;min-width:0}
input.big{font-size:18px;font-weight:700;letter-spacing:.01em}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:14px;border-top:1px dashed var(--line)}
.facts div{padding:10px 2px 2px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;font-size:15px}
.facts.empty{color:var(--muted);font-size:13px;padding-top:12px;display:block}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.err{color:var(--red);font-size:13px;margin-top:10px}
.mt{margin-top:12px}

.phone{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);border-radius:30px;padding:12px;box-shadow:0 18px 40px -22px rgba(20,30,50,.55)}
.screen{background:var(--screen);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.screen .bar{background:var(--yellow);color:var(--on-yellow);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.screen .bar span{font-weight:500;font-size:12px;opacity:.8}
.thread{padding:14px 12px 10px}
.bubble{display:block;width:100%;background:var(--bubble);border:0;border-radius:4px 16px 16px 16px;padding:13px 14px;font-size:14px;line-height:1.6;min-height:320px;max-height:62vh;resize:none;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.meta{display:flex;justify-content:space-between;gap:8px;padding:2px 14px 10px;font-size:12px;color:var(--muted)}
.warns{margin:0 12px 10px;padding:0;list-style:none}
.warns li{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:7px 10px;border-radius:8px;margin-top:6px}
.actions{display:flex;gap:8px;padding:10px 2px 2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow);flex:1;font-size:16px}
.phone .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.sm{padding:6px 11px;font-size:13px;font-weight:500}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}

/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 4px}
.panel > p.desc{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:70ch}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.ed{border-collapse:collapse;width:100%;font-size:13.5px}
table.ed th{background:var(--sunk);text-align:left;font-weight:500;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed th.grp{text-align:center;color:var(--ink);font-weight:700;border-left:1px solid var(--line)}
table.ed td{border-bottom:1px solid var(--line);padding:3px 4px;vertical-align:middle}
table.ed tr:last-child td{border-bottom:0}
table.ed td input[type=text]{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 7px;font-size:13.5px}
table.ed td input[type=text]:hover{border-color:var(--line)}
table.ed td input[type=text]:focus{background:var(--sunk);border-color:var(--blue)}
table.ed td.x{width:36px;text-align:center}
table.ed td.calc{font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 10px}
table.ed td.calc.bad{color:var(--red)}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.xbtn:hover{color:var(--red);background:var(--red-soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.tpl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.tpl-grid textarea{min-height:520px;font-size:14px}
pre.preview{white-space:pre-wrap;background:var(--screen);border-radius:12px;padding:14px;margin:0;font:14px/1.6 inherit;min-height:520px}
.ph-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ph-list button{border:1px solid var(--line);background:var(--yellow-soft);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.helpbox{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.65}
.helpbox b{color:var(--ink)}
.banner{background:var(--yellow-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);z-index:20;max-width:calc(100% - 24px)}
.savebar[hidden]{display:none}
.savebar .btn{border-color:rgba(255,255,255,.25);background:transparent;color:inherit}
.savebar .btn.primary{background:var(--yellow);color:var(--on-yellow);flex:none;font-size:15px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 24px)}
.toast.on{opacity:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
@media (max-width:900px){
  .compose{grid-template-columns:1fr}
  .phone{position:static}
  .tpl-grid{grid-template-columns:1fr}
  .tpl-grid textarea,pre.preview{min-height:320px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function h(tag, attrs){
  var el = document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v = attrs[k]; if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2), v);
    else if(k==='value') el.value = v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++){
    var c = arguments[i]; if(c==null||c===false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x!=null&&x!==false) el.append(x); }); else el.append(c);
  }
  return el;
}
function $(id){return document.getElementById(id);}
function list(s){return String(s||'').split(/[,\/\s]+/).map(function(x){return x.trim();}).filter(Boolean);}

function won(n){return n.toLocaleString('ko-KR')+'원';}
function gradeLabel(g){g=Number(g); if(!g) return ''; if(g<=6) return '초'+g; if(g<=9) return '중'+(g-6); return '고'+(g-9);}

function fmtClock(t){
  var m = String(t||'').match(/(\d{1,2}):(\d{2})/); if(!m) return '';
  var hh = +m[1], mm = m[2];
  return (hh<10?'0':'')+hh+':'+mm;
}

/* ---------- 반 코드 해석 ---------- */
function parseCode(raw){
  var s = String(raw||'').trim(); if(!s) return null;
  var m = s.replace(/\s+/g,'').match(/^([\d,]+)-([A-Za-z]+\+?\d*?)-?(\d)([A-Za-z])/);
  if(!m) return {err:'반 코드 형식을 확인하세요. 예: 4-LA2-2c'};
  return { code:m[0], grades:m[1].split(',').filter(Boolean).map(Number), level:m[2], levelKey:m[2].replace(/\d+$/,''), period:m[3], teacher:m[4].toLowerCase() };
}
function levelName(p){ var k=p.levelKey.toUpperCase(), r=(CFG.levelNames||[]).find(function(x){return String(x.code).trim().toUpperCase()===k;}); return r&&String(r.name).trim()? String(r.name).trim()+p.level.slice(p.levelKey.length) : p.level; }
function periodIndex(code){ for(var i=0;i<CFG.periods.length;i++) if(String(CFG.periods[i].code).trim()===String(code)) return i; return -1; }
function classInfo(raw, gradeSel){
  var p = parseCode(raw); if(!p) return null; if(p.err) return {errs:[p.err]};
  var errs=[], out={p:p};
  var pi = periodIndex(p.period); out.pi = pi; out.per = CFG.periods[pi];
  if(!out.per) errs.push(p.period+'코드 수업시간이 [반·선생님] 탭에 없습니다.');
  out.t = CFG.teachers.find(function(t){return String(t.code).trim().toLowerCase()===p.teacher;});
  if(!out.t) errs.push('선생님 코드 "'+p.teacher+'"가 [반·선생님] 탭에 없습니다.');
  var key = p.levelKey.toUpperCase();
  var row = CFG.fees.find(function(r){ return list(r.levels).some(function(l){return l.toUpperCase()===key;}); });
  out.row = row;
  if(!row) errs.push(p.levelKey+' 레벨이 [교육비] 탭 표에 없습니다.');
  out.fee = null;
  if(row && out.per){
    var base = num(row['f'+num(out.per.min)]);
    if(!base) errs.push(row.course+' '+p.levelKey+' 레벨의 '+num(out.per.min)+'분 교육비가 비어 있습니다.');
    else if(row.online){
      var g = p.grades[0] || 0;
      var o = g ? CFG.online.find(function(x){return list(x.grades).map(Number).indexOf(g)>=0;}) : null;
      if(!o){ errs.push('반 코드 첫 숫자('+g+') 학년의 온라인 수강료가 [교육비] 탭에 없습니다.'); out.fee={total:base, detail:won(base)+' + 온라인 수강료(확인 필요)'}; }
      else { var on=num(o.fee); out.fee={total:base+on, detail:won(base)+' + 온라인 '+won(on)+' (합계 '+won(base+on)+')', base:base, online:on}; }
    } else out.fee={total:base, detail:won(base)+(row.note?' ('+row.note+')':''), base:base};
  }
  out.errs = errs;
  return out;
}

/* ---------- 셔틀 ---------- */
function findBus(name){return CFG.buses.find(function(b){return b.bus===name;});}
function shuttleInfo(ci){
  if(S.use==='none') return null;
  var bus = findBus(S.bus); if(!bus) return {errs:['호차를 골라 주세요.']};
  var stop = bus.stops[S.stop]; if(!stop) return {errs:['정류장을 골라 주세요.'], bus:bus};
  if(!ci || !ci.per) return {errs:['배정반을 입력하면 셔틀 시간이 나옵니다.'], bus:bus, stop:stop};
  var idx = ci.pi, code = ci.p.period, errs=[];
  var runBus = bus, exc = String(stop.except||'').match(/^\s*([\d,\s]+)\s*:\s*(.+)$/);
  if(exc && list(exc[1]).indexOf(code)>=0){ var rb = findBus(exc[2].trim()); if(rb) runBus = rb; }
  var up = (stop.up||[])[idx]||'', dn = (stop.down||[])[idx]||'';

    editTable({rows:CFG.teachers, cols:[col('code','코드',60),col('name','이름',100),col('eng','영어 이름',110),col('room','강의실',80)],
      newRow:function(){return {code:'',name:'',eng:'',room:''};}})));
  if(!CFG.levelNames) CFG.levelNames=[];
  view.append(panel('레벨 표시 이름','반 코드의 레벨을 문자에 보일 이름으로 바꿉니다. 예: DB → DSB 이면 4-DB2-2d는 "DSB2 과정"으로 나갑니다. 표에 없는 레벨(PA, HB 등)은 코드 그대로 나갑니다.',
    editTable({rows:CFG.levelNames, cols:[col('code','반 코드 레벨',100,'DB'),col('name','문자에 보일 이름',140,'DSB')], newRow:function(){return {code:'',name:''};}})));
  var paste = h('textarea',{rows:4,placeholder:'엑셀 시간표에서 반이 적힌 칸들을 통째로 복사해 붙여넣으세요. 반 코드만 골라 목록을 새로 만듭니다.'});
  var classTbl = editTable({rows:CFG.classes, cols:[col('code','반 코드',140,'4-LA2-2c'),col('note','메모(목록에만 보임)',180)],
    calcLabel:'자동 인식', calc:function(r){ var ci=classInfo(r.code); if(!ci) return {text:''}; if(ci.errs&&ci.errs.length&&!ci.per) return {text:ci.errs[0],bad:true};
      return {text:[ci.row?ci.row.course:'과정?', ci.per?daysLabel(ci.per.days)+' '+ci.per.time:'', ci.t?ci.t.name+' '+ci.t.room:'담임?', ci.fee?won(ci.fee.total):'교육비?'].join('   '), bad:ci.errs.length>0}; },
    newRow:function(){return {code:'',note:''};}});
  view.append(panel('반 목록','문자 만들기 화면의 배정반 목록에 나오는 반입니다. 시간표가 바뀌면 여기만 고치면 됩니다.', classTbl,

      h('button',{class:'btn sm',onclick:function(){
        var found=[], seen={}; (paste.value.match(/[\d,]+-[A-Za-z]+\+?\d*-?\d[A-Za-z]/g)||[]).forEach(function(s){ var p=parseCode(s); if(p&&!p.err&&!seen[p.code]){ seen[p.code]=1; found.push({code:p.code,note:''}); } });
        if(!found.length){ toast('붙여넣은 내용에서 반 코드를 찾지 못했습니다'); return; }
        CFG.classes.length=0; found.forEach(function(x){CFG.classes.push(x);}); paste.value=''; classTbl.redraw(); markDirty(); toast(found.length+'개 반으로 목록을 바꿨습니다');

/* ---------- 셔틀 ---------- */
function parseClock(s){
  s=String(s||'').trim(); var m=s.match(/(\d{1,2}):(\d{2})/); if(!m) return '';
  var hh=+m[1]; if(/오전|AM/i.test(s)){ if(hh===12) hh=0; } else if(hh<12) hh+=12;
  return (hh<10?'0':'')+hh+':'+m[2];
}
function norm(s){return String(s||'').replace(/[\s()·.\-]/g,'');}
function viewShuttle(view){
  localBanner(view);
  if(busSel>=CFG.buses.length) busSel=0;
  var chips = h('div',{class:'chips',role:'tablist'}, CFG.buses.map(function(b,i){
    return h('button',{class:'chip','aria-pressed':String(i===busSel),onclick:function(){busSel=i; shell();}}, b.bus||'(이름 없음)');
  }), h('button',{class:'chip add',onclick:function(){ var n=CFG.buses.length; CFG.buses.push({bus:'새 호차',driver:'',phone:'',mwf:'',tt:'',stops:[]}); busSel=n; markDirty(); shell(); }},'+ 호차 추가'));
  view.append(chips);
  var b = CFG.buses[busSel];
  if(!b){ view.append(panel('셔틀이 없습니다','위의 + 호차 추가를 눌러 시작하세요.')); return; }
  function meta(key,label,ph){ return h('label',{class:'f'},label, h('input',{type:'text',value:b[key]||'',placeholder:ph||'',oninput:function(e){b[key]=e.target.value; markDirty(); if(key==='bus') document.querySelector('.chip[aria-pressed="true"]').textContent=e.target.value;}})); }
  view.append(panel(b.bus+' 기본 정보', null,
    h('div',{class:'two'}, meta('bus','호차 이름','1호차'), meta('driver','기사님 성함'), meta('phone','기사님 번호','010-0000-0000'), meta('mwf','월수금 도우미 선생님 번호'), meta('tt','화목 도우미 선생님 번호')),
    h('div',{class:'tools'}, h('button',{class:'btn sm danger',onclick:function(){ if(confirm(b.bus+'를 삭제할까요?')){ CFG.buses.splice(busSel,1); busSel=0; markDirty(); shell(); } }},'이 호차 삭제'))));
  var N = CFG.periods.length, cols=[col('name','등원 정류장',200), col('downName','하원 정류장(다를 때만)',170)];
  b.stops.forEach(function(s){ s.up=s.up||[]; s.down=s.down||[]; });
  for(var i=0;i<N;i++)(function(i){ var c={label:CFG.periods[i].code+'코드',w:58,ph:'-',get:function(r){return r.up[i]||'';},set:function(r,v){r.up[i]=v;}}; cols.push(c); })(i);
  for(var j=0;j<N;j++)(function(j){ var c={label:CFG.periods[j].code+'코드',w:58,ph:'-',get:function(r){return r.down[j]||'';},set:function(r,v){r.down[j]=v;}}; cols.push(c); })(j);
  cols.push(col('except','예외 운행',90,'1:5호차'));
  var tbl = editTable({rows:b.stops, cols:cols, groups:[{span:2,label:''},{span:N,label:'등원 탑승 시간'},{span:N,label:'하원 하차 시간'},{span:1,label:''}],
    newRow:function(){return {name:'',downName:'',up:[],down:[],except:''};}, addLabel:'+ 정류장 추가'});
  view.append(panel('정류장과 시간', '시간은 24시간제(13:55)로 적습니다. 운행하지 않는 코드는 비워 두거나 - 를 넣으세요. "예외 운행"에 1:5호차 처럼 적으면 해당 코드만 다른 호차 기사님 번호로 안내합니다.', tbl));
  var mode='up', ta=h('textarea',{rows:6,placeholder:'엑셀 셔틀 시간표에서 [정류장 이름 + 1~6코드 시간] 칸을 복사해 붙여넣으세요.\n앞에 순번 칸이 있어도 괜찮습니다.'});
  view.append(panel('엑셀에서 시간 한 번에 넣기','정류장 이름이 같은 줄을 찾아 시간을 바꿉니다. 등원 모드에서 처음 보는 정류장은 새로 추가합니다.',
    seg([['up','등원 시간'],['down','하원 시간']],'up',function(v){mode=v;}), h('div',{class:'mt'},ta),
    h('div',{class:'tools'}, h('button',{class:'btn sm',onclick:function(){
      var lines=ta.value.replace(/\r/g,'').split('\n').filter(function(l){return l.trim();}), done=0, added=0, miss=[];
      lines.forEach(function(l){
        var cells=l.split('\t').map(function(c){return c.trim();});
        while(cells.length && (/^\d+$/.test(cells[0]) || !cells[0])) cells.shift();
        if(!cells.length || /학원|순번|정차/.test(cells[0])) return;
        var name=cells[0], times=cells.slice(1,1+N).map(function(c){ var t=parseClock(c); return t; });
        var st=b.stops.find(function(s){return norm(s.name)===norm(name) || (s.downName && norm(s.downName)===norm(name));});
        if(!st){ if(mode==='up'){ st={name:name,downName:'',up:[],down:[],except:''}; b.stops.push(st); added++; } else { miss.push(name); return; } }
        for(var k=0;k<N;k++) st[mode][k]=times[k]||'';
        done++;
      });
      markDirty(); shell();
      toast(done+'개 정류장 반영'+(added?', '+added+'개 추가':'')+(miss.length?', 못 찾음: '+miss.join(', '):''));
    }},'시간 반영하기'))));
}

/* ---------- 교육비 ---------- */

    editTable({rows:CFG.fees, cols:cols, newRow:function(){return {course:'',levels:'',online:false,note:''};}})));
  view.append(panel('온라인 수강료 (온라인 별도 과정)','반 코드의 첫 숫자로 찾습니다. 6=초6, 7=중1, 8=중2, 9=중3.',
    editTable({rows:CFG.online, cols:[col('grades','학년 숫자',100,'6, 7'),col('label','표시 이름',110,'초6/중1'),col('fee','금액',100,'23000')], newRow:function(){return {grades:'',label:'',fee:''};}})));
}

/* ---------- 문자 양식 ---------- */
function viewTemplate(view){
  localBanner(view);
  var ta=h('textarea',{value:CFG.template,spellcheck:'false','aria-label':'문자 양식'});
  var pre=h('pre',{class:'preview','aria-live':'polite'});
  function sample(){
    if(S.cls.trim()) return S;
    var first=(CFG.classes.find(function(c){return /-D[A-D]\d*-2/.test(c.code);})||CFG.classes[0]||{}).code||'', bus=CFG.buses[0];
    return {type:S.type,name:S.name||'김정상',prev:S.prev||'3-DD1-1h',grade:'',cls:first,start:'2026-12-02',use:'up',bus:bus?bus.bus:'',stop:bus&&bus.stops.length?'0':'',memo:S.memo};
  }
  function refresh(){ var r=buildValues(sample()); pre.textContent=renderTemplate(CFG.template,r.v,r.flags); }
  ta.addEventListener('input',function(){ CFG.template=ta.value; markDirty(); refresh(); });
  function ins(txt){ var s=ta.selectionStart, e=ta.selectionEnd; ta.setRangeText(txt,s,e,'end'); ta.focus(); CFG.template=ta.value; markDirty(); refresh(); }
  var typeSeg = seg([['신규','신규로 미리보기'],['반이동','반 이동으로 미리보기']], S.type, function(v){S.type=v; refresh();});
  view.append(panel('문자 양식','여기서 문구를 고치면 모든 문자에 바로 반영됩니다.',
    h('div',{class:'helpbox'},
      h('b',null,'{항목}'),' 자리에 자동으로 값이 들어갑니다. 값이 비어 있는 항목이 있는 줄은 통째로 빠집니다 (예: 첫 수업일을 안 넣으면 그 줄이 사라짐).', h('br'),
      h('b',null,'<신규> … </신규>'),' 처럼 한 줄에 따로 적은 태그 사이의 내용은 조건이 맞을 때만 나옵니다. 쓸 수 있는 태그: ', BLOCKS.map(function(b){return '<'+b+'>';}).join(' '),' (그 외 항목 이름도 태그로 쓰면 값이 있을 때만 나옵니다)'),
    h('div',{class:'ph-list'}, PH.map(function(p){ return h('button',{type:'button',title:'커서 위치에 넣기',onclick:function(){ins('{'+p+'}');}},'{'+p+'}'); })),
    h('div',{class:'tpl-grid'}, h('div',null,ta, h('div',{class:'tools'}, h('button',{class:'btn sm',onclick:function(){ if(confirm('처음 제공된 양식으로 되돌릴까요?')){ CFG.template=EMBED.template; ta.value=CFG.template; markDirty(); refresh(); } }},'처음 양식으로'))),
      h('div',null, h('div',{style:'margin-bottom:8px'},typeSeg), pre))));
  refresh();
}

/* ---------- 저장 ---------- */
function buildPage(cfg){
  var json = JSON.stringify(cfg).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n'+HEAD_KEEP+'\n</head>\n<body>\n<div id="app"></div>\n<'+SC+' type="application/json" id="cfg">'+json+'</'+SC+'>\n'+MAIN_SRC+'\n</body>\n</html>\n';
}
function saveLocal(msg){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(CFG)); SAVED=JSON.stringify(CFG); usingLocal=true; markDirty(); shell(); toast(msg); }
  catch(e){ toast('저장하지 못했습니다'); }
}
function save(){
  CFG.savedAt = new Date().toISOString();
  if(!artifactNS){ saveLocal(IN_CLAUDE? '이 브라우저에 저장했습니다' : '이 브라우저에 저장했습니다. 모두에게 반영하려면 [파일 내려받기] 후 다시 올려 주세요'); return; }
  toast('저장 중…');
  artifactNS.publish(buildPage(CFG)).then(function(){
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    SAVED=JSON.stringify(CFG); markDirty(); toast('저장했습니다. 모든 선생님 화면에 반영됩니다');
  }).catch(function(err){
    var code = err && (err.code||err.name) || '';
    if(code==='conflict'){ toast('다른 분이 먼저 저장했습니다. 새로 열린 화면에서 다시 고쳐 주세요'); return; }
    saveLocal('편집 권한이 없어 이 브라우저에만 저장했습니다');
  });
}
function downloadPage(){
  CFG.savedAt = new Date().toISOString();
  var html = buildPage(CFG);
  try{
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})); a.download=FILE_NAME;
    document.body.append(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1000);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(CFG)); }catch(e){}
    SAVED=JSON.stringify(CFG); markDirty(); toast(FILE_NAME+' 파일을 내려받았습니다. 웹 저장소에 올리면 모두에게 반영됩니다');
  }catch(e){ toast('내려받지 못했습니다'); }
}
window.addEventListener('beforeunload',function(e){ if(JSON.stringify(CFG)!==SAVED){ e.preventDefault(); e.returnValue=''; } });

shell();
})();
</script>
